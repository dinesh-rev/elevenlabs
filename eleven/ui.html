<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commentary</title>
<style>
  :root {
    --bg:#12141a; --panel:#1b1e26; --line:#2b2f3a; --text:#e8eaf0;
    --dim:#8b93a7; --accent:#4ea1ff; --on:#2f6f3f; --warn:#a33; --ok:#3fa45b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:20px; }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase;
       color:var(--dim); font-weight:600; margin:0 0 16px; }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:16px; margin-bottom:14px; }
  .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase;
           color:var(--dim); margin-bottom:10px; }

  /* live match */
  .score { display:flex; align-items:center; gap:14px; margin:6px 0; }
  .score .nm { flex:1; font-size:17px; }
  .score .pt { font-variant-numeric:tabular-nums; font-size:24px; min-width:2ch;
               text-align:right; }
  .meta { color:var(--dim); font-size:13px; margin-top:10px;
          display:flex; gap:14px; flex-wrap:wrap; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block;
         margin-right:6px; background:var(--warn); }
  .dot.live { background:var(--ok); }

  /* buttons */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .two  { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { font:inherit; color:var(--text); background:#232733;
           border:1px solid var(--line); border-radius:8px; padding:12px 10px;
           cursor:pointer; text-align:center; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button[aria-pressed="true"] { background:var(--on); border-color:var(--ok); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .play { width:100%; padding:18px; font-size:17px; font-weight:600;
          background:var(--accent); color:#06121f; border:none; margin-top:4px; }
  .play:disabled { background:#31465c; color:#7f93a8; }

  /* log */
  #log { font-size:13px; max-height:220px; overflow:auto; }
  #log div { padding:8px 0; border-bottom:1px solid var(--line); }
  #log div:last-child { border-bottom:0; }
  .t { color:var(--dim); font-size:11px; }
  .err { color:#ff8b8b; }
  .cost { color:var(--dim); font-size:11px; }
</style>

<div class="wrap">
  <h1>Commentary</h1>

  <div class="card">
    <div class="label">Live match <span id="mode"></span></div>
    <div class="score"><span class="nm" id="n1">—</span><span class="pt" id="s1">0</span></div>
    <div class="score"><span class="nm" id="n2">—</span><span class="pt" id="s2">0</span></div>
    <div class="meta">
      <span><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
      <span id="court"></span><span id="games"></span><span id="cached"></span>
    </div>
  </div>

  <div class="card">
    <div class="label">Who is it about</div>
    <div class="two" id="players">
      <button data-p="A" aria-pressed="true" id="pa">Player A</button>
      <button data-p="B" aria-pressed="false" id="pb">Player B</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Category</div>
    <div class="grid" id="cats"></div>
  </div>

  <button class="play" id="go">Load &amp; Play</button>
  <audio id="au" style="display:none"></audio>

  <div class="card" style="margin-top:14px">
    <div class="label">Recent</div>
    <div id="log"><div class="t">nothing yet</div></div>
  </div>
</div>

<script>
const CATS = ["match_start", "rally", "smash", "highlights", "winners", "convo"];
let category = "smash", player = "A", busy = false;

const $ = id => document.getElementById(id);

// category buttons
CATS.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c.replace("_", " ");
  b.setAttribute("aria-pressed", c === category);
  b.onclick = () => {
    category = c;
    [...$("cats").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  $("cats").append(b);
});

// player toggle
$("players").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  player = b.dataset.p;
  [...$("players").children].forEach(x => x.setAttribute("aria-pressed", x === b));
};

// live state, polled
async function poll() {
  try {
    const [s, p] = await Promise.all([
      fetch("/state").then(r => r.json()),
      fetch("/pieces").then(r => r.json()),
    ]);
    $("n1").textContent = s.player1 || "—";
    $("n2").textContent = s.player2 || "—";
    $("s1").textContent = s.score1;
    $("s2").textContent = s.score2;
    $("pa").textContent = s.player1 || "Player A";
    $("pb").textContent = s.player2 || "Player B";
    $("court").textContent = s.court_name || (s.court ? "Court " + s.court : "");
    $("games").textContent = s.set_no ? `games ${s.games1}–${s.games2} · set ${s.set_no}` : "";
    $("cached").textContent = `${p.cached} pieces cached`;
    const ready = s.confirmed && s.player1;
    $("dot").className = "dot" + (ready ? " live" : "");
    $("status").textContent = !s.court ? "no match on this court"
                            : !s.confirmed ? "names not confirmed" : (s.status || "live");
  } catch { $("status").textContent = "server unreachable"; }
}

async function health() {
  try {
    const h = await fetch("/health").then(r => r.json());
    $("mode").textContent = h.dry_run ? "— DRY RUN, no audio" : "";
  } catch {}
}

function log(html, cls = "") {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span> ${html}`;
  const box = $("log");
  if (box.firstChild && box.firstChild.textContent.includes("nothing yet")) box.innerHTML = "";
  box.prepend(d);
}

$("go").onclick = async () => {
  if (busy) return;
  busy = true;
  $("go").disabled = true;
  $("go").textContent = "Working…";
  try {
    const r = await fetch(`/${category}?player=${player}`, { method: "POST" });
    const d = await r.json();
    if (!r.ok) {
      log(`<b>${category}</b> — ${d.error || r.status}`, "err");
    } else {
      log(`<b>${category}</b> ${d.text.replace(/\n/g, " ")}
           <div class="cost">${d.seconds}s · new ${d.synthesized_chars} cr ·
           reused ${d.reused_chars} cr</div>`);
      // the server plays it locally too; this is so you hear it on whichever
      // machine has the panel open
      if (d.saved_as) {
        const au = $("au");
        au.src = "/audio/" + d.saved_as.split("/").pop() + "?t=" + Date.now();
        au.play().catch(() => log("browser blocked autoplay — click the page once", "err"));
      }
    }
  } catch (e) {
    log("request failed: " + e.message, "err");
  } finally {
    busy = false;
    $("go").disabled = false;
    $("go").textContent = "Load & Play";
    poll();
  }
};

poll(); health();
setInterval(poll, 2000);
</script>
